<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solana Alpha — Live</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#F5F3EE;
      --surface:#FFFFFF;
      --text:#171728;
      --muted:#66667A;
      --border:#E6E4DC;
      --accent:#0F9F7A;
      --pos:#00875a;
      --neg:#d92d20;
      --radius-panel:16px;
      --radius-row:12px;
      --radius-badge:999px;
      --shadow-sm:0 1px 2px rgba(23,23,40,0.04),0 2px 6px rgba(23,23,40,0.02);
      --shadow-md:0 2px 8px rgba(23,23,40,0.06),0 4px 16px rgba(23,23,40,0.04);
      --shadow-lift:0 4px 12px rgba(23,23,40,0.08),0 8px 24px rgba(23,23,40,0.06);
      --ease-smooth:cubic-bezier(0.22,1,0.36,1);
      --duration-fast:160ms;
      --duration-spatial:280ms;
      --spacing-xs:8px;
      --spacing-sm:12px;
      --spacing-md:16px;
      --spacing-lg:24px;
      --spacing-xl:32px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:'Plus Jakarta Sans',sans-serif;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }
    .wrap{
      max-width:1100px;
      margin:0 auto;
      padding:var(--spacing-xl) 18px 56px;
    }
    h1{
      font-family:'Space Grotesk',sans-serif;
      font-size:clamp(2.2rem,4vw,3rem);
      margin:0;
      font-weight:700;
      letter-spacing:-0.02em;
      line-height:1.1;
    }
    .sub{
      margin:10px 0 0;
      color:var(--muted);
      font-size:1.02rem;
      line-height:1.5;
      max-width:580px;
    }
    .bar{
      display:flex;
      justify-content:space-between;
      gap:var(--spacing-md);
      flex-wrap:wrap;
      align-items:flex-end;
      margin-bottom:var(--spacing-lg);
    }
    .updated{
      font-size:.92rem;
      color:var(--muted);
      display:flex;
      align-items:center;
      gap:8px;
    }
    .live-pulse{
      width:8px;
      height:8px;
      background:var(--accent);
      border-radius:50%;
      animation:pulse 2s var(--ease-smooth) infinite;
    }
    @keyframes pulse{
      0%,100%{opacity:1;transform:scale(1)}
      50%{opacity:.6;transform:scale(0.9)}
    }
    .overview{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
      gap:var(--spacing-sm);
      margin:var(--spacing-lg) 0 var(--spacing-xl);
    }
    .stat{
      background:var(--surface);
      border-radius:var(--radius-row);
      padding:14px 16px;
      box-shadow:var(--shadow-sm);
      transition:all var(--duration-fast) var(--ease-smooth);
    }
    .stat:hover{
      box-shadow:var(--shadow-md);
      transform:translateY(-1px);
    }
    .stat .k{
      font-size:.72rem;
      color:var(--muted);
      text-transform:uppercase;
      letter-spacing:.1em;
      font-weight:600;
    }
    .stat .v{
      font-size:1.25rem;
      font-weight:700;
      margin-top:6px;
      font-variant-numeric:tabular-nums;
    }
    .grid{
      display:grid;
      grid-template-columns:1fr;
      gap:var(--spacing-md);
      margin-bottom:var(--spacing-lg);
    }
    @media (min-width:920px){
      .grid{grid-template-columns:repeat(3,1fr)}
    }
    .panel{
      background:var(--surface);
      border-radius:var(--radius-panel);
      padding:var(--spacing-md);
      box-shadow:var(--shadow-sm);
    }
    .panel h2{
      font-family:'Space Grotesk',sans-serif;
      font-size:1.2rem;
      font-weight:600;
      margin:0 0 var(--spacing-sm);
      letter-spacing:-0.01em;
    }
    .list{
      display:flex;
      flex-direction:column;
      gap:var(--spacing-xs);
    }
    .row{
      border-radius:var(--radius-row);
      padding:var(--spacing-sm);
      transition:all var(--duration-fast) var(--ease-smooth);
      background:transparent;
      opacity:0;
      animation:fadeInUp var(--duration-spatial) var(--ease-smooth) forwards;
    }
    @keyframes fadeInUp{
      from{opacity:0;transform:translateY(6px)}
      to{opacity:1;transform:translateY(0)}
    }
    .row:nth-child(1){animation-delay:0ms}
    .row:nth-child(2){animation-delay:40ms}
    .row:nth-child(3){animation-delay:80ms}
    .row:nth-child(4){animation-delay:120ms}
    .row:nth-child(5){animation-delay:160ms}
    .row:nth-child(6){animation-delay:200ms}
    .row:nth-child(7){animation-delay:240ms}
    .row:nth-child(8){animation-delay:280ms}
    .row:nth-child(9){animation-delay:320ms}
    .row:nth-child(10){animation-delay:360ms}
    a .row{cursor:pointer}
    a .row:hover{
      background:var(--bg);
      box-shadow:var(--shadow-sm);
      transform:translateY(-1px);
    }
    a .row:focus-visible{
      outline:2px solid var(--accent);
      outline-offset:2px;
    }
    .top{
      display:flex;
      justify-content:space-between;
      gap:var(--spacing-sm);
      align-items:center;
    }
    .sym{
      font-weight:700;
      font-size:0.98rem;
    }
    .name{
      font-size:.84rem;
      color:var(--muted);
      margin-top:2px;
    }
    .num{
      font-variant-numeric:tabular-nums;
      text-align:right;
    }
    .price{
      font-weight:600;
    }
    .chg{
      font-size:.88rem;
      font-weight:600;
    }
    .chg.pos{color:var(--pos)}
    .chg.neg{color:var(--neg)}
    .meta{
      display:flex;
      justify-content:space-between;
      gap:var(--spacing-xs);
      font-size:.8rem;
      color:var(--muted);
      margin-top:var(--spacing-xs);
    }
    .empty{
      color:var(--muted);
      font-size:.92rem;
      padding:var(--spacing-sm);
      text-align:center;
    }
    .loading{
      display:flex;
      flex-direction:column;
      gap:var(--spacing-xs);
    }
    .skeleton{
      background:linear-gradient(90deg,var(--bg) 25%,#f0eee9 50%,var(--bg) 75%);
      background-size:200% 100%;
      animation:shimmer 1.5s infinite;
      border-radius:var(--radius-row);
      height:72px;
    }
    @keyframes shimmer{
      0%{background-position:200% 0}
      100%{background-position:-200% 0}
    }
    .scout{
      margin-top:var(--spacing-lg);
    }
    .scout .panel{
      border:2px solid var(--accent);
      box-shadow:var(--shadow-md);
      position:relative;
      overflow:hidden;
    }
    .scout .panel::before{
      content:'';
      position:absolute;
      top:0;
      left:0;
      right:0;
      height:3px;
      background:linear-gradient(90deg,var(--accent),#0db88b);
    }
    .scout h2{
      padding-top:4px;
    }
    .scout .row{
      padding:var(--spacing-sm);
    }
    .badge{
      display:inline-flex;
      align-items:center;
      padding:4px 10px;
      border-radius:var(--radius-badge);
      font-size:.7rem;
      font-weight:700;
      letter-spacing:.03em;
    }
    .badge.new{
      background:#eef4ff;
      color:#2a4bcf;
    }
    .badge.conf-high{
      background:#e8fff2;
      color:#067647;
    }
    .badge.conf-mid{
      background:#fff7e6;
      color:#b54708;
    }
    .badge.conf-low{
      background:#ffeceb;
      color:#b42318;
    }
    .labels{
      display:flex;
      gap:6px;
      flex-wrap:wrap;
    }
    .mechanic{
      font-size:.84rem;
      color:#3a3a4f;
      margin-top:var(--spacing-xs);
      line-height:1.4;
    }
    a{
      color:inherit;
      text-decoration:none;
    }
    @media (prefers-reduced-motion:reduce){
      *,*::before,*::after{
        animation-duration:0.01ms!important;
        animation-iteration-count:1!important;
        transition-duration:0.01ms!important;
      }
    }
    @media (max-width:360px){
      .wrap{padding:var(--spacing-md) 14px 40px}
      h1{font-size:1.8rem}
      .stat{padding:10px 12px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="bar">
      <div>
        <h1>Solana Alpha</h1>
        <p class="sub">Live token intelligence from DexScreener + scout findings context.</p>
      </div>
      <div class="updated" id="updatedAt"><span class="live-pulse"></span>Updating…</div>
    </header>

    <section class="overview" id="overview"></section>

    <section class="grid">
      <article class="panel">
        <h2>Top Gainers (24h)</h2>
        <div class="list" id="gainers"><div class="loading"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div></div>
      </article>
      <article class="panel">
        <h2>New Listings (72h)</h2>
        <div class="list" id="newListings"><div class="loading"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div></div>
      </article>
      <article class="panel">
        <h2>Trending</h2>
        <div class="list" id="trending"><div class="loading"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div></div>
      </article>
    </section>

    <section class="scout">
      <article class="panel">
        <h2>Scout Finds</h2>
        <div class="list" id="scoutFinds"><div class="loading"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div></div>
      </article>
    </section>
  </div>

  <script>
    const money = (n)=> new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:n>=1?0:6}).format(Number(n||0));
    const compactMoney = (n)=> new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',notation:'compact',maximumFractionDigits:2}).format(Number(n||0));
    const pct = (n)=> `${Number(n||0).toFixed(2)}%`;
    const age = (ms)=>{
      if(!ms) return 'n/a';
      const h = Math.floor((Date.now()-ms)/36e5);
      if(h<1) return '<1h';
      if(h<24) return `${h}h`;
      return `${Math.floor(h/24)}d`;
    };

    function renderOverview(m){
      const data = [
        ['Token Universe', m.tokenUniverse],
        ['Investable', m.investableUniverse],
        ['24h Volume', compactMoney(m.total24hVolumeUsd)],
        ['Liquidity', compactMoney(m.totalLiquidityUsd)],
        ['Avg 24h Change', pct(m.avg24hChangePct)],
        ['Gainers / Losers', `${m.gainersCount} / ${m.losersCount}`]
      ];
      document.getElementById('overview').innerHTML = data.map(([k,v])=>`<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');
    }

    function tokenRow(t, withAge=false){
      const chgClass = Number(t.priceChange24h) >= 0 ? 'pos' : 'neg';
      const linkStart = t.url ? `<a href="${t.url}" target="_blank" rel="noopener noreferrer">` : '';
      const linkEnd = t.url ? '</a>' : '';
      return `<div class="row">${linkStart}
        <div class="top">
          <div><div class="sym">${t.symbol}</div><div class="name">${t.name}</div></div>
          <div class="num"><div class="price">${money(t.priceUsd)}</div><div class="chg ${chgClass}">${pct(t.priceChange24h)}</div></div>
        </div>
        <div class="meta"><span>MCap ${compactMoney(t.marketCap)}</span><span>Vol ${compactMoney(t.volume24h)}</span>${withAge?`<span>${age(t.pairCreatedAt)}</span>`:''}</div>
      ${linkEnd}</div>`;
    }

    function renderList(id, arr, withAge=false){
      const el = document.getElementById(id);
      if(!arr || !arr.length){el.innerHTML='<div class="empty">No live tokens matched current filters.</div>'; return;}
      el.innerHTML = arr.slice(0,10).map((t)=>tokenRow(t, withAge)).join('');
    }

    function confidenceClass(conf){
      const n = Number(conf||0);
      if(n >= 75) return 'conf-high';
      if(n >= 50) return 'conf-mid';
      return 'conf-low';
    }

    function scoutRow(t){
      const conf = Number(t.confidence||0);
      return `<div class="row">
        <div class="top">
          <div>
            <div class="sym">${t.name} <span class="name">$${t.ticker}</span></div>
            <div class="name">MCap ${t.marketCap || 'n/a'}</div>
          </div>
          <div class="labels">
            ${t.isNew ? '<span class="badge new">New</span>' : ''}
            <span class="badge ${confidenceClass(conf)}">${conf}/100</span>
          </div>
        </div>
        <div class="mechanic">${t.rewardMechanic || 'Hold-to-earn mechanics tracked by scout.'}</div>
      </div>`;
    }

    function renderScout(arr){
      const el = document.getElementById('scoutFinds');
      if(!arr || !arr.length){
        el.innerHTML = '<div class="empty">No scout findings available yet.</div>';
        return;
      }
      el.innerHTML = arr.slice(0,8).map(scoutRow).join('');
    }

    async function load(){
      try{
        const [liveRes, scoutRes] = await Promise.all([
          fetch('./data/live-data.json?ts='+Date.now(), {cache:'no-store'}),
          fetch('./data/scout-findings.json?ts='+Date.now(), {cache:'no-store'}).catch(()=>null)
        ]);

        if(!liveRes.ok) throw new Error(`HTTP ${liveRes.status}`);
        const data = await liveRes.json();
        renderOverview(data.marketOverview || {});
        renderList('gainers', data.topGainers || []);
        renderList('newListings', data.newListings || [], true);
        renderList('trending', data.trending || []);

        if(scoutRes && scoutRes.ok){
          const scoutData = await scoutRes.json();
          renderScout(scoutData.tokens || []);
        } else {
          renderScout([]);
        }

        const updated = data.generatedAt ? new Date(data.generatedAt) : new Date();
        document.getElementById('updatedAt').innerHTML = `<span class="live-pulse"></span>Last update: ${updated.toLocaleString('en-AU', {timeZone:'Australia/Melbourne'})}`;
      }catch(err){
        ['gainers','newListings','trending'].forEach((id)=>{
          document.getElementById(id).innerHTML = `<div class="empty">Failed to load live data (${err.message}).</div>`;
        });
        document.getElementById('scoutFinds').innerHTML = '<div class="empty">Failed to load scout findings.</div>';
        document.getElementById('updatedAt').innerHTML = '<span class="live-pulse"></span>Last update: unavailable';
      }
    }

    load();
  </script>
</body>
</html>
