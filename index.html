<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invest-Innovation — Live</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#F5F3EE;
      --surface:#FFFFFF;
      --text:#171728;
      --muted:#66667A;
      --border:#E6E4DC;
      --accent:#0F9F7A;
      --pos:#00875a;
      --neg:#d92d20;
      --radius-panel:16px;
      --radius-row:12px;
      --radius-badge:999px;
      --shadow-sm:0 1px 2px rgba(23,23,40,0.04),0 2px 6px rgba(23,23,40,0.02);
      --shadow-md:0 2px 8px rgba(23,23,40,0.06),0 4px 16px rgba(23,23,40,0.04);
      --shadow-lift:0 4px 12px rgba(23,23,40,0.08),0 8px 24px rgba(23,23,40,0.06);
      --ease-smooth:cubic-bezier(0.22,1,0.36,1);
      --duration-fast:160ms;
      --duration-spatial:280ms;
      --spacing-xs:8px;
      --spacing-sm:12px;
      --spacing-md:16px;
      --spacing-lg:24px;
      --spacing-xl:32px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:'Plus Jakarta Sans',sans-serif;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }
    .wrap{
      max-width:1100px;
      margin:0 auto;
      padding:var(--spacing-xl) 18px 56px;
    }
    h1{
      font-family:'Space Grotesk',sans-serif;
      font-size:clamp(2.2rem,4vw,3rem);
      margin:0;
      font-weight:700;
      letter-spacing:-0.02em;
      line-height:1.1;
      position:relative;
      display:inline-block;
    }
    h1::after{
      content:'';
      position:absolute;
      bottom:-6px;
      left:0;
      width:60px;
      height:3px;
      background:linear-gradient(90deg,var(--accent),transparent);
      border-radius:2px;
    }
    .sub{
      margin:10px 0 0;
      color:var(--muted);
      font-size:1.02rem;
      line-height:1.5;
      max-width:580px;
    }
    .bar{
      display:flex;
      justify-content:space-between;
      gap:var(--spacing-md);
      flex-wrap:wrap;
      align-items:flex-end;
      margin-bottom:var(--spacing-xl);
      padding-bottom:var(--spacing-lg);
      border-bottom:1px solid var(--border);
    }
    .updated{
      font-size:.92rem;
      color:var(--muted);
      display:flex;
      align-items:center;
      gap:8px;
    }
    .live-pulse{
      width:8px;
      height:8px;
      background:var(--accent);
      border-radius:50%;
      animation:pulse 2s var(--ease-smooth) infinite;
    }
    @keyframes pulse{
      0%,100%{opacity:1;transform:scale(1)}
      50%{opacity:.6;transform:scale(0.9)}
    }
    .overview{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
      gap:var(--spacing-sm);
      margin:var(--spacing-lg) 0 var(--spacing-xl);
    }
    .stat{
      background:var(--surface);
      border-radius:var(--radius-row);
      padding:14px 16px;
      box-shadow:var(--shadow-sm);
      transition:all var(--duration-fast) var(--ease-smooth);
      position:relative;
      overflow:hidden;
    }
    .stat::before{
      content:'';
      position:absolute;
      top:0;
      left:0;
      width:3px;
      height:100%;
      background:var(--border);
      transition:background var(--duration-fast) var(--ease-smooth);
    }
    .stat:hover{
      box-shadow:var(--shadow-md);
      transform:translateY(-1px);
    }
    .stat:hover::before{
      background:var(--accent);
    }
    .stat .k{
      font-size:.72rem;
      color:var(--muted);
      text-transform:uppercase;
      letter-spacing:.1em;
      font-weight:600;
    }
    .stat .v{
      font-size:1.25rem;
      font-weight:700;
      margin-top:6px;
      font-variant-numeric:tabular-nums;
    }
    .panel{
      background:var(--surface);
      border-radius:var(--radius-panel);
      padding:var(--spacing-md);
      box-shadow:var(--shadow-sm);
    }
    .panel h2{
      font-family:'Space Grotesk',sans-serif;
      font-size:1.2rem;
      font-weight:600;
      margin:0 0 var(--spacing-sm);
      letter-spacing:-0.01em;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }
    .panel-count{
      font-size:.78rem;
      font-weight:500;
      color:var(--muted);
      font-family:'Plus Jakarta Sans',sans-serif;
    }
    .list{
      display:flex;
      flex-direction:column;
      gap:var(--spacing-xs);
    }
    .row{
      border-radius:var(--radius-row);
      padding:var(--spacing-sm);
      transition:all var(--duration-fast) var(--ease-smooth);
      background:transparent;
      opacity:0;
      animation:fadeInUp var(--duration-spatial) var(--ease-smooth) forwards;
    }
    @keyframes fadeInUp{
      from{opacity:0;transform:translateY(6px)}
      to{opacity:1;transform:translateY(0)}
    }
    .row:nth-child(1){animation-delay:0ms}
    .row:nth-child(2){animation-delay:40ms}
    .row:nth-child(3){animation-delay:80ms}
    .row:nth-child(4){animation-delay:120ms}
    .row:nth-child(5){animation-delay:160ms}
    .row:nth-child(6){animation-delay:200ms}
    .row:nth-child(7){animation-delay:240ms}
    .row:nth-child(8){animation-delay:280ms}
    .row:nth-child(9){animation-delay:320ms}
    .row:nth-child(10){animation-delay:360ms}
    a .row{cursor:pointer}
    a .row:hover{
      background:var(--bg);
      box-shadow:var(--shadow-sm);
      transform:translateY(-1px);
    }
    a .row:focus-visible{
      outline:2px solid var(--accent);
      outline-offset:2px;
    }
    .top{
      display:flex;
      justify-content:space-between;
      gap:var(--spacing-sm);
      align-items:center;
    }
    .sym{
      font-weight:700;
      font-size:0.98rem;
    }
    .name{
      font-size:.84rem;
      color:var(--muted);
      margin-top:2px;
    }
    .num{
      font-variant-numeric:tabular-nums;
      text-align:right;
    }
    .price{
      font-weight:600;
    }
    .chg{
      font-size:.88rem;
      font-weight:600;
    }
    .chg.pos{color:var(--pos)}
    .chg.neg{color:var(--neg)}
    .meta{
      display:flex;
      justify-content:space-between;
      gap:var(--spacing-xs);
      font-size:.8rem;
      color:var(--muted);
      margin-top:var(--spacing-xs);
    }
    .empty{
      color:var(--muted);
      font-size:.92rem;
      padding:var(--spacing-lg) var(--spacing-sm);
      text-align:center;
      font-style:italic;
    }
    .loading{
      display:flex;
      flex-direction:column;
      gap:var(--spacing-xs);
    }
    .skeleton{
      background:linear-gradient(90deg,var(--bg) 25%,#f0eee9 50%,var(--bg) 75%);
      background-size:200% 100%;
      animation:shimmer 1.5s infinite;
      border-radius:var(--radius-row);
      height:72px;
    }
    @keyframes shimmer{
      0%{background-position:200% 0}
      100%{background-position:-200% 0}
    }
    .scout{
      margin-top:var(--spacing-xl);
    }
    .scout .panel{
      border:2px solid var(--accent);
      box-shadow:var(--shadow-md),0 0 0 4px rgba(15,159,122,0.06);
      position:relative;
      overflow:hidden;
      background:linear-gradient(180deg,rgba(15,159,122,0.02) 0%,var(--surface) 40%);
    }
    .scout .panel::before{
      content:'';
      position:absolute;
      top:0;
      left:0;
      right:0;
      height:3px;
      background:linear-gradient(90deg,var(--accent),#0db88b);
    }
    .scout h2{
      padding-top:4px;
      color:var(--text);
    }
    .scout h2{
      font-size:1.25rem;
    }
    .scout h2::before{
      content:'⬤';
      font-size:.6rem;
      color:var(--accent);
      margin-right:8px;
      vertical-align:middle;
    }
    .scout .row{
      padding:var(--spacing-sm);
    }
    .strategy{
      margin-top:var(--spacing-lg);
      margin-bottom:var(--spacing-lg);
    }
    .strategy .panel{
      border:1px solid #e8b44c;
      box-shadow:var(--shadow-md);
      position:relative;
      overflow:hidden;
      background:linear-gradient(180deg,rgba(232,180,76,0.02) 0%,var(--surface) 50%);
    }
    .strategy .panel::before{
      content:'';
      position:absolute;
      top:0;
      left:0;
      right:0;
      height:2px;
      background:linear-gradient(90deg,#e8b44c,#f4d03f);
    }
    .strategy h2{
      padding-top:3px;
      color:var(--text);
      font-size:1.15rem;
    }
    .strategy h2::before{
      content:'₿';
      font-size:.9rem;
      color:#e8b44c;
      margin-right:8px;
      font-weight:700;
    }
    .strategy .row{
      padding:var(--spacing-sm);
    }
    .instrument-type{
      display:inline-block;
      font-size:.68rem;
      font-weight:600;
      color:#9f7b2c;
      background:rgba(232,180,76,0.1);
      padding:2px 6px;
      border-radius:4px;
      margin-left:6px;
      text-transform:uppercase;
      letter-spacing:.02em;
    }
    .badge{
      display:inline-flex;
      align-items:center;
      padding:4px 10px;
      border-radius:var(--radius-badge);
      font-size:.7rem;
      font-weight:700;
      letter-spacing:.03em;
    }
    .badge.new{
      background:#eef4ff;
      color:#2a4bcf;
    }
    .badge.conf-high{
      background:#e8fff2;
      color:#067647;
    }
    .badge.conf-mid{
      background:#fff7e6;
      color:#b54708;
    }
    .badge.conf-low{
      background:#ffeceb;
      color:#b42318;
    }
    .labels{
      display:flex;
      gap:6px;
      flex-wrap:wrap;
    }
    .mechanic{
      font-size:.84rem;
      color:#3a3a4f;
      margin-top:var(--spacing-xs);
      line-height:1.4;
    }
    .pnl-row{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(110px,1fr));
      gap:var(--spacing-xs);
      margin-top:var(--spacing-xs);
      font-size:.78rem;
      padding-top:var(--spacing-xs);
      border-top:1px solid var(--border);
    }
    .pnl-item{
      display:flex;
      flex-direction:column;
      gap:2px;
    }
    .pnl-label{
      color:var(--muted);
      font-size:.7rem;
      text-transform:uppercase;
      letter-spacing:.04em;
      font-weight:600;
    }
    .pnl-value{
      font-weight:600;
      font-variant-numeric:tabular-nums;
    }
    .pnl-value.pos{
      color:var(--pos);
    }
    .pnl-value.neg{
      color:var(--neg);
    }
    .contract-row{
      display:flex;
      align-items:center;
      gap:8px;
      margin-top:var(--spacing-xs);
      font-size:.78rem;
      color:var(--muted);
    }
    .contract-label{
      font-weight:600;
      text-transform:uppercase;
      letter-spacing:.04em;
      font-size:.7rem;
    }
    .contract-address{
      font-family:'Courier New',monospace;
      font-size:.82rem;
      color:var(--text);
      background:var(--bg);
      padding:4px 8px;
      border-radius:6px;
      border:1px solid var(--border);
    }
    .copy-btn{
      background:var(--accent);
      color:white;
      border:none;
      border-radius:6px;
      padding:4px 10px;
      font-size:.7rem;
      font-weight:600;
      cursor:pointer;
      transition:all var(--duration-fast) var(--ease-smooth);
      text-transform:uppercase;
      letter-spacing:.02em;
      min-width:52px;
    }
    .copy-btn:hover{
      background:#0db88b;
      transform:translateY(-1px);
      box-shadow:var(--shadow-sm);
    }
    .copy-btn:active{
      transform:translateY(0);
    }
    .copy-btn.copied{
      background:var(--pos);
    }
    .token-logo{
      width:32px;
      height:32px;
      border-radius:50%;
      object-fit:cover;
      flex-shrink:0;
      border:2px solid var(--border);
    }
    .token-logo-fallback{
      width:32px;
      height:32px;
      border-radius:50%;
      background:var(--bg);
      border:2px solid var(--border);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:.68rem;
      font-weight:700;
      color:var(--muted);
      flex-shrink:0;
      font-family:'Space Grotesk',sans-serif;
      letter-spacing:-.02em;
    }
    a{
      color:inherit;
      text-decoration:none;
    }
    a:focus{
      outline:none;
    }
    a:focus .row{
      outline:2px solid var(--accent);
      outline-offset:2px;
      border-radius:var(--radius-row);
    }
    @media (prefers-reduced-motion:reduce){
      *,*::before,*::after{
        animation-duration:0.01ms!important;
        animation-iteration-count:1!important;
        transition-duration:0.01ms!important;
      }
    }
    @media (max-width:360px){
      .wrap{padding:var(--spacing-md) 14px 40px}
      h1{font-size:1.8rem}
      .stat{padding:10px 12px}
    }
    .agent-badge{
      position:fixed;
      bottom:20px;
      right:20px;
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:var(--radius-row);
      padding:10px 16px;
      font-size:.82rem;
      color:var(--muted);
      box-shadow:var(--shadow-md);
      transition:all var(--duration-fast) var(--ease-smooth);
      z-index:100;
    }
    .agent-badge:hover{
      box-shadow:var(--shadow-lift);
      transform:translateY(-2px);
      border-color:var(--accent);
    }
    .agent-badge a{
      color:var(--accent);
      text-decoration:none;
      font-weight:600;
    }
    .agent-badge a:hover{
      text-decoration:underline;
    }
    .agent-demo{
      margin-top:var(--spacing-lg);
      padding:var(--spacing-md);
      background:rgba(15,159,122,0.04);
      border:1px solid rgba(15,159,122,0.2);
      border-radius:var(--radius-row);
    }
    .agent-demo h3{
      font-size:1rem;
      font-weight:600;
      margin:0 0 var(--spacing-sm);
      color:var(--text);
    }
    .agent-demo-btn{
      background:var(--accent);
      color:white;
      border:none;
      border-radius:var(--radius-badge);
      padding:10px 20px;
      font-size:.92rem;
      font-weight:600;
      cursor:pointer;
      transition:all var(--duration-fast) var(--ease-smooth);
    }
    .agent-demo-btn:hover{
      background:#0db88b;
      transform:translateY(-1px);
      box-shadow:var(--shadow-md);
    }
    .agent-demo-btn:disabled{
      background:var(--muted);
      cursor:not-allowed;
      transform:none;
    }
    .agent-demo-result{
      margin-top:var(--spacing-sm);
      padding:var(--spacing-sm);
      background:var(--surface);
      border-radius:var(--radius-row);
      font-size:.88rem;
      max-height:300px;
      overflow-y:auto;
    }
    .agent-demo-facts{
      color:var(--text);
      margin-bottom:var(--spacing-sm);
    }
    .agent-demo-delight{
      color:var(--muted);
      font-style:italic;
      border-top:1px solid var(--border);
      padding-top:var(--spacing-xs);
      margin-top:var(--spacing-xs);
    }
    .investanswers{
      margin-top:var(--spacing-lg);
      margin-bottom:var(--spacing-lg);
    }
    .investanswers .panel{
      border:1px solid #6b8dd6;
      box-shadow:var(--shadow-md);
      position:relative;
      overflow:hidden;
      background:linear-gradient(180deg,rgba(107,141,214,0.02) 0%,var(--surface) 50%);
    }
    .investanswers .panel::before{
      content:'';
      position:absolute;
      top:0;
      left:0;
      right:0;
      height:2px;
      background:linear-gradient(90deg,#6b8dd6,#8ba5e0);
    }
    .investanswers h2{
      padding-top:3px;
      color:var(--text);
      font-size:1.15rem;
    }
    .investanswers h2::before{
      content:'◆';
      font-size:.8rem;
      color:#6b8dd6;
      margin-right:8px;
      font-weight:700;
    }
    .ia-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
      gap:var(--spacing-md);
      margin-top:var(--spacing-md);
    }
    .ia-card{
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:var(--radius-row);
      padding:var(--spacing-md);
      transition:all var(--duration-fast) var(--ease-smooth);
      opacity:0;
      animation:fadeInUp var(--duration-spatial) var(--ease-smooth) forwards;
    }
    .ia-card:hover{
      box-shadow:var(--shadow-md);
      transform:translateY(-1px);
      border-color:#6b8dd6;
    }
    .ia-card-header{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      margin-bottom:var(--spacing-sm);
    }
    .ia-card-title{
      font-weight:700;
      font-size:1rem;
      color:var(--text);
      font-family:'Space Grotesk',sans-serif;
    }
    .ia-card-ticker{
      font-size:.78rem;
      color:var(--muted);
      font-weight:600;
      background:var(--bg);
      padding:3px 8px;
      border-radius:var(--radius-badge);
      margin-top:2px;
    }
    .ia-card-thesis{
      font-size:.86rem;
      color:var(--text);
      line-height:1.4;
      margin-bottom:var(--spacing-sm);
      padding-bottom:var(--spacing-sm);
      border-bottom:1px solid var(--border);
    }
    .ia-highlight{
      margin-bottom:var(--spacing-xs);
      padding:var(--spacing-xs);
      background:var(--bg);
      border-radius:6px;
      border-left:3px solid transparent;
    }
    .ia-highlight.impact-high{
      border-left-color:#6b8dd6;
    }
    .ia-highlight.impact-medium{
      border-left-color:var(--muted);
    }
    .ia-highlight-label{
      font-size:.72rem;
      color:var(--muted);
      text-transform:uppercase;
      letter-spacing:.04em;
      font-weight:600;
      margin-bottom:2px;
    }
    .ia-highlight-value{
      font-size:.88rem;
      font-weight:600;
      color:var(--text);
      margin-bottom:2px;
    }
    .ia-highlight-detail{
      font-size:.78rem;
      color:var(--muted);
      line-height:1.3;
    }
    .ia-footer{
      margin-top:var(--spacing-lg);
      padding-top:var(--spacing-md);
      border-top:1px solid var(--border);
      font-size:.84rem;
      color:var(--muted);
      line-height:1.5;
    }
    .ia-sources{
      display:flex;
      gap:var(--spacing-sm);
      flex-wrap:wrap;
      margin-bottom:var(--spacing-xs);
    }
    .ia-sources a{
      color:#6b8dd6;
      font-weight:600;
      text-decoration:none;
      transition:color var(--duration-fast) var(--ease-smooth);
    }
    .ia-sources a:hover{
      color:#5277c5;
      text-decoration:underline;
    }
    .ia-disclaimer{
      font-style:italic;
      color:var(--muted);
      margin-top:var(--spacing-xs);
    }
    .ia-updated{
      font-size:.78rem;
      color:var(--muted);
      margin-top:var(--spacing-xs);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="bar">
      <div>
        <h1>Invest-Innovation</h1>
        <p class="sub">Tracking reward-generating assets, wealth-building instruments, and high-conviction research insights.</p>
      </div>
      <div class="updated" id="updatedAt"><span class="live-pulse"></span>Updating…</div>
    </header>

    <section class="overview" id="overview"></section>

    <section class="strategy">
      <article class="panel">
        <h2>Strategy / Saylor Stack</h2>
        <div class="list" id="strategyStack"><div class="loading"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div></div>
      </article>
    </section>


    <section class="scout">
      <article class="panel">
        <h2>Scout Finds — Hold-to-Earn Focus</h2>
        <div class="list" id="scoutFinds"><div class="loading"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div></div>
      </article>
    </section>

    <section class="investanswers" id="investanswers-tracker">
      <article class="panel">
        <h2>InvestAnswers Tracker</h2>
        <div class="ia-grid" id="investAnswersGrid"><div class="loading"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div></div>
        <div class="ia-footer" id="investAnswersFooter"></div>
      </article>
    </section>

    <div class="agent-demo">
      <h3>Ask as Agent</h3>
      <p style="font-size:.88rem;color:var(--muted);margin:0 0 var(--spacing-sm)">
        Try the agent-callable tools in your browser:
      </p>
      <button class="agent-demo-btn" id="demoBtn" onclick="runAgentDemo()">List Scout Assets</button>
      <div id="demoResult" style="display:none" class="agent-demo-result"></div>
    </div>
  </div>

  <div class="agent-badge">
    Agent-ready · <a href="./agent/README.md" target="_blank">WebMCP</a>
  </div>

  <script src="./js/delight.js"></script>
  <script src="./js/webmcp.js"></script>
  <script src="js/envelope.js"></script>
  <script src="js/webmcp.js"></script>
  
  <script>
    const money = (n)=> new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:n>=1?0:6}).format(Number(n||0));
    const compactMoney = (n)=> new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',notation:'compact',maximumFractionDigits:2}).format(Number(n||0));
    const pct = (n)=> `${Number(n||0).toFixed(2)}%`;
    const age = (ms)=>{
      if(!ms) return 'n/a';
      const h = Math.floor((Date.now()-ms)/36e5);
      if(h<1) return '<1h';
      if(h<24) return `${h}h`;
      return `${Math.floor(h/24)}d`;
    };

    function renderOverview(scoutData, strategyData){
      const scoutCount = (scoutData?.tokens || []).length;
      const strategyCount = (strategyData?.instruments || []).filter(i => i.currentPriceUsd > 0).length;
      const scoutWithPnL = (scoutData?.tokens || []).filter(t => t.entryPriceUsd > 0).length;
      const strategyWithPnL = (strategyData?.instruments || []).filter(i => i.entryPriceUsd > 0).length;
      
      const data = [
        ['Scout Finds', scoutCount],
        ['Strategy Instruments', strategyCount],
        ['Scout w/ PnL', scoutWithPnL],
        ['Strategy w/ PnL', strategyWithPnL]
      ];
      document.getElementById('overview').innerHTML = data.map(([k,v])=>`<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');
    }

    function confidenceClass(conf){
      const n = Number(conf||0);
      if(n >= 75) return 'conf-high';
      if(n >= 50) return 'conf-mid';
      return 'conf-low';
    }

    function getInitials(ticker) {
      if (!ticker) return '??';
      return ticker.slice(0, Math.min(3, ticker.length)).toUpperCase();
    }

    function scoutRow(t){
      const conf = Number(t.confidence||0);
      const hasPnL = t.entryPriceUsd > 0 && t.currentPriceUsd > 0;
      const pnlPct = t.pnlPct || 0;
      const pnlClass = pnlPct >= 0 ? 'pos' : 'neg';
      const pnlSign = pnlPct > 0 ? '+' : '';
      
      // Logo with fallback
      const logoHtml = t.imageUrl 
        ? `<img src="${t.imageUrl}" alt="${t.ticker}" class="token-logo" loading="lazy" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" /><div class="token-logo-fallback" style="display:none;">${getInitials(t.ticker)}</div>`
        : `<div class="token-logo-fallback">${getInitials(t.ticker)}</div>`;
      
      // Contract address with copy
      const contractHtml = t.tokenAddress ? `
        <div class="contract-row" onclick="event.preventDefault(); event.stopPropagation(); copyAddress('${t.tokenAddress}', this);">
          <span class="contract-label">Mint</span>
          <span class="contract-address">${t.tokenAddress.slice(0,4)}…${t.tokenAddress.slice(-4)}</span>
          <button class="copy-btn" type="button">Copy</button>
        </div>
      ` : '';
      
      const pnlSection = hasPnL ? `
        <div class="pnl-row">
          <div class="pnl-item">
            <span class="pnl-label">Tracked since</span>
            <span class="pnl-value">${t.addedAt || 'n/a'}</span>
          </div>
          <div class="pnl-item">
            <span class="pnl-label">Tracked @</span>
            <span class="pnl-value">${money(t.entryPriceUsd)}</span>
          </div>
          <div class="pnl-item">
            <span class="pnl-label">Now</span>
            <span class="pnl-value">${money(t.currentPriceUsd)}</span>
          </div>
          <div class="pnl-item">
            <span class="pnl-label">PnL</span>
            <span class="pnl-value ${pnlClass}">${pnlSign}${pnlPct.toFixed(2)}%</span>
          </div>
        </div>
      ` : '';
      
      const linkStart = t.dexUrl ? `<a href="${t.dexUrl}" target="_blank" rel="noopener noreferrer">` : '';
      const linkEnd = t.dexUrl ? '</a>' : '';
      
      return `<div class="row">${linkStart}
        <div class="top">
          <div style="display:flex;align-items:center;gap:12px;">
            ${logoHtml}
            <div>
              <div class="sym">${t.name} <span class="name">$${t.ticker}</span></div>
              <div class="name">MCap ${t.marketCap || 'n/a'}</div>
            </div>
          </div>
          <div class="labels">
            ${t.isNew ? '<span class="badge new">New</span>' : ''}
            <span class="badge ${confidenceClass(conf)}">${conf}/100</span>
          </div>
        </div>
        <div class="mechanic">${t.rewardMechanic || 'Hold-to-earn mechanics tracked by scout.'}</div>
        ${contractHtml}
        ${pnlSection}
      ${linkEnd}</div>`;
    }

    function renderScout(arr){
      const el = document.getElementById('scoutFinds');
      if(!arr || !arr.length){
        el.innerHTML = '<div class="empty">No scout findings available yet.</div>';
        return;
      }
      const parentPanel = el.closest('.panel');
      const header = parentPanel?.querySelector('h2');
      const displayCount = Math.min(arr.length, 8);
      if(header && !header.querySelector('.panel-count')){
        const countSpan = document.createElement('span');
        countSpan.className = 'panel-count';
        countSpan.textContent = displayCount;
        header.appendChild(countSpan);
      }
      el.innerHTML = arr.slice(0,8).map(scoutRow).join('');
    }

    function strategyRow(inst){
      const hasPnL = inst.entryPriceUsd > 0 && inst.currentPriceUsd > 0;
      const pnlPct = inst.pnlPct || 0;
      const pnlClass = pnlPct >= 0 ? 'pos' : 'neg';
      const pnlSign = pnlPct > 0 ? '+' : '';
      
      // Type labels with clear distinctions
      let typeLabel = '';
      if (inst.type === 'tokenized_equity') {
        typeLabel = '1:1 Redeemable';
      } else if (inst.type === 'synthetic_tracker') {
        typeLabel = 'xStock Tracker';
      } else if (inst.type === 'preferred') {
        typeLabel = 'Preferred';
      } else {
        typeLabel = 'Common Stock';
      }
      
      // Logo with fallback
      const logoHtml = inst.imageUrl 
        ? `<img src="${inst.imageUrl}" alt="${inst.ticker}" class="token-logo" loading="lazy" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" /><div class="token-logo-fallback" style="display:none;">${getInitials(inst.ticker)}</div>`
        : `<div class="token-logo-fallback">${getInitials(inst.ticker)}</div>`;
      
      // Contract address with copy (prefer tokenAddress, fall back to solanaTokenAddress)
      const contractAddress = inst.tokenAddress || inst.solanaTokenAddress;
      const contractHtml = contractAddress ? `
        <div class="contract-row" onclick="event.preventDefault(); event.stopPropagation(); copyAddress('${contractAddress}', this);">
          <span class="contract-label">Mint</span>
          <span class="contract-address">${contractAddress.slice(0,4)}…${contractAddress.slice(-4)}</span>
          <button class="copy-btn" type="button">Copy</button>
        </div>
      ` : '';
      
      const priceSource = inst.priceSource ? `(${inst.priceSource})` : '';
      
      const pnlSection = hasPnL ? `
        <div class="pnl-row">
          <div class="pnl-item">
            <span class="pnl-label">Tracked since</span>
            <span class="pnl-value">${inst.addedAt || 'n/a'}</span>
          </div>
          <div class="pnl-item">
            <span class="pnl-label">Tracked @</span>
            <span class="pnl-value">${money(inst.entryPriceUsd)}</span>
          </div>
          <div class="pnl-item">
            <span class="pnl-label">Now ${priceSource}</span>
            <span class="pnl-value">${money(inst.currentPriceUsd)}</span>
          </div>
          <div class="pnl-item">
            <span class="pnl-label">PnL</span>
            <span class="pnl-value ${pnlClass}">${pnlSign}${pnlPct.toFixed(2)}%</span>
          </div>
        </div>
      ` : '';
      
      const linkUrl = inst.dexUrl || inst.solanaDexUrl || inst.infoUrl;
      const linkStart = linkUrl ? `<a href="${linkUrl}" target="_blank" rel="noopener noreferrer">` : '';
      const linkEnd = linkUrl ? '</a>' : '';
      
      return `<div class="row">${linkStart}
        <div class="top">
          <div style="display:flex;align-items:center;gap:12px;">
            ${logoHtml}
            <div>
              <div class="sym">${inst.ticker}<span class="instrument-type">${typeLabel}</span></div>
              <div class="name">${inst.name}</div>
            </div>
          </div>
        </div>
        <div class="mechanic">${inst.description}</div>
        ${contractHtml}
        ${pnlSection}
      ${linkEnd}</div>`;
    }

    function renderStrategy(arr){
      const el = document.getElementById('strategyStack');
      if(!arr || !arr.length){
        el.innerHTML = '<div class="empty">No Strategy instruments available.</div>';
        return;
      }
      const parentPanel = el.closest('.panel');
      const header = parentPanel?.querySelector('h2');
      const displayCount = arr.filter(i => i.currentPriceUsd > 0).length;
      if(header && !header.querySelector('.panel-count')){
        const countSpan = document.createElement('span');
        countSpan.className = 'panel-count';
        countSpan.textContent = displayCount;
        header.appendChild(countSpan);
      }
      el.innerHTML = arr.map(strategyRow).join('');
    }

    async function load(){
      try{
        const [scoutRes, strategyRes] = await Promise.all([
          fetch('./data/scout-findings.json?ts='+Date.now(), {cache:'no-store'}).catch(()=>null),
          fetch('./data/strategy-stack.json?ts='+Date.now(), {cache:'no-store'}).catch(()=>null)
        ]);

        let scoutData = null;
        let strategyData = null;

        if(scoutRes && scoutRes.ok){
          scoutData = await scoutRes.json();
          renderScout(scoutData.tokens || []);
        } else {
          renderScout([]);
        }

        if(strategyRes && strategyRes.ok){
          strategyData = await strategyRes.json();
          renderStrategy(strategyData.instruments || []);
        } else {
          renderStrategy([]);
        }

        renderOverview(scoutData, strategyData);

        const updated = new Date();
        document.getElementById('updatedAt').innerHTML = `<span class="live-pulse"></span>Last update: ${updated.toLocaleString('en-AU', {timeZone:'Australia/Melbourne'})}`;
      }catch(err){
        document.getElementById('scoutFinds').innerHTML = '<div class="empty">Failed to load scout findings.</div>';
        document.getElementById('strategyStack').innerHTML = '<div class="empty">Failed to load Strategy stack.</div>';
        document.getElementById('updatedAt').innerHTML = '<span class="live-pulse"></span>Last update: unavailable';
      }
    }

    load();
    loadInvestAnswers();

    // Normalize dashes: replace em dashes, en dashes, arrows with "to"
    function normalizeDashes(str) {
      if (!str) return '';
      return str
        .replace(/—/g, ' ')  // em dash
        .replace(/–/g, ' to ')  // en dash
        .replace(/→/g, ' to ')  // arrow
        .replace(/\s+/g, ' ')  // collapse multiple spaces
        .trim();
    }

    async function loadInvestAnswers() {
      try {
        const res = await fetch('./data/investanswers-highlights.json?ts=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) {
          renderInvestAnswersEmpty();
          return;
        }
        
        const data = await res.json();
        renderInvestAnswers(data);
      } catch (err) {
        renderInvestAnswersEmpty();
      }
    }

    function renderInvestAnswersEmpty() {
      const grid = document.getElementById('investAnswersGrid');
      grid.innerHTML = '<div class="empty">InvestAnswers highlights unavailable.</div>';
      document.getElementById('investAnswersFooter').innerHTML = '';
    }

    function renderInvestAnswers(data) {
      const grid = document.getElementById('investAnswersGrid');
      const footer = document.getElementById('investAnswersFooter');
      
      if (!data.assets || data.assets.length === 0) {
        renderInvestAnswersEmpty();
        return;
      }
      
      // Render cards
      grid.innerHTML = data.assets.map((asset, idx) => {
        const highlightsHtml = (asset.highlights || []).map(h => {
          const impactClass = h.impact ? `impact-${h.impact}` : '';
          const normalizedValue = normalizeDashes(h.value);
          const normalizedDetail = h.detail ? normalizeDashes(h.detail) : '';
          
          return `
            <div class="ia-highlight ${impactClass}">
              <div class="ia-highlight-label">${h.label}</div>
              <div class="ia-highlight-value">${normalizedValue}</div>
              ${normalizedDetail ? `<div class="ia-highlight-detail">${normalizedDetail}</div>` : ''}
            </div>
          `;
        }).join('');
        
        const normalizedThesis = normalizeDashes(asset.thesis);
        
        return `
          <div class="ia-card" style="animation-delay:${idx * 40}ms">
            <div class="ia-card-header">
              <div>
                <div class="ia-card-title">${asset.name}</div>
                <div class="ia-card-ticker">${asset.ticker}</div>
              </div>
            </div>
            <div class="ia-card-thesis">${normalizedThesis}</div>
            ${highlightsHtml}
          </div>
        `;
      }).join('');
      
      // Render footer with attribution, disclaimer, and updated date
      const sourcesHtml = (data.sourcePrimary || []).map(s => 
        `<a href="${s.url}" target="_blank" rel="noopener noreferrer">${s.label}</a>`
      ).join(' · ');
      
      footer.innerHTML = `
        <div class="ia-sources">Sources: ${sourcesHtml}</div>
        <div class="ia-disclaimer">${data.disclaimer}</div>
        <div class="ia-updated">Updated: ${data.updatedAt}</div>
      `;
    }

    // Copy contract address to clipboard
    function copyAddress(address, element) {
      const btn = element.querySelector('.copy-btn');
      if (!btn) return;
      
      const originalText = btn.textContent;
      
      // Try modern clipboard API first
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(address)
          .then(() => {
            btn.textContent = 'Copied!';
            btn.classList.add('copied');
            setTimeout(() => {
              btn.textContent = originalText;
              btn.classList.remove('copied');
            }, 1500);
          })
          .catch(() => {
            // Fallback to older method
            fallbackCopy(address, btn, originalText);
          });
      } else {
        // Fallback for older browsers
        fallbackCopy(address, btn, originalText);
      }
    }

    function fallbackCopy(text, btn, originalText) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      
      try {
        document.execCommand('copy');
        btn.textContent = 'Copied!';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = originalText;
          btn.classList.remove('copied');
        }, 1500);
      } catch (err) {
        btn.textContent = 'Failed';
        setTimeout(() => {
          btn.textContent = originalText;
        }, 1500);
      }
      
      document.body.removeChild(textarea);
    }

    // Agent demo function
    async function runAgentDemo() {
      const btn = document.getElementById('demoBtn');
      const result = document.getElementById('demoResult');
      
      btn.disabled = true;
      btn.textContent = 'Loading...';
      result.style.display = 'none';
      
      try {
        // Wait for data to load
        await loadData();
        
        // Simulate calling list_scout_assets
        const response = await fetch('./data/scout-findings.json?ts=' + Date.now(), { cache: 'no-store' });
        const data = await response.json();
        
        // Pick first 3 items for demo
        const items = data.tokens.slice(0, 3).map(t => ({
          name: t.name,
          ticker: t.ticker,
          marketCap: t.marketCap,
          rewardMechanic: t.rewardMechanic,
          confidence: t.confidence,
          currentPriceUsd: t.currentPriceUsd,
          pnlPct: t.pnlPct
        }));
        
        // Add delight beat
        const delightBeat = pickDelightLine();
        
        // Format result
        let html = '<div class="agent-demo-facts"><strong>Facts returned:</strong><ul style="margin:.5em 0;padding-left:1.5em">';
        items.forEach(item => {
          html += `<li><strong>${item.name}</strong> ($${item.ticker}): ${item.marketCap} · ${item.confidence}/100 confidence · $${item.currentPriceUsd.toFixed(6)}</li>`;
        });
        html += `</ul><em>Total: ${data.tokens.length} scout tokens</em></div>`;
        
        if (delightBeat) {
          html += `<div class="agent-demo-delight">${delightBeat.emoji || ''} ${delightBeat.line}</div>`;
        }
        
        result.innerHTML = html;
        result.style.display = 'block';
        
        btn.textContent = 'Try Again';
      } catch (err) {
        result.innerHTML = '<div style="color:var(--neg)">Demo failed: ' + err.message + '</div>';
        result.style.display = 'block';
        btn.textContent = 'Retry';
      } finally {
        btn.disabled = false;
      }
    }
  </script>
